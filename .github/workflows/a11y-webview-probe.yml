---
# Diagnostic for the K-9 accessibility fork: on an Android emulator, compares how a screen reader can move through
# message text by character and word in a plain WebView, in K-9's message view setup, and in variations of it.
# Results are shown in the run summary and uploaded as an artifact.
name: Diagnose - WebView screen reader probe

on:
  workflow_dispatch:
  push:
    branches:
      - a11y-message-actions
    paths:
      - 'legacy/ui/legacy/src/androidTest/**'
      - '.github/workflows/a11y-webview-probe.yml'

permissions:
  contents: read

concurrency:
  group: a11y-webview-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [35]

    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Cleanup disk
        uses: ./.github/actions/disk-cleanup

      - name: Setup Gradle environment
        uses: ./.github/actions/setup-gradle

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build probe APKs
        run: ./gradlew --no-daemon :legacy:ui:legacy:assembleDebugAndroidTest

      - name: Run probe on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew --no-daemon :legacy:ui:legacy:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.fsck.k9.a11yprobe.WebViewGranularityProbeTest || echo "Probe test run reported a failure"
            adb logcat -d -s A11yProbe:I > probe-results.txt || true

      - name: Show results
        if: always()
        run: |
          touch probe-results.txt
          cat probe-results.txt
          {
            echo "## WebView screen reader probe (API ${{ matrix.api-level }})"
            echo '```'
            cat probe-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webview-probe-api-${{ matrix.api-level }}
          path: |
            probe-results.txt
            legacy/ui/legacy/build/reports/androidTests/
            legacy/ui/legacy/build/outputs/androidTest-results/
          if-no-files-found: warn
